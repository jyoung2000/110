services:
  wallpaper-scraper:
    build: .
    container_name: wallpaper-scraper
    ports:
      - "1629:1629"
    environment:
      - PUID=99
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ./data:/app/data
      - scraper-fallback:/tmp/scraper-data
    restart: unless-stopped
    mem_limit: 6g
    cpus: "6.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1629/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

volumes:
  scraper-fallback:
