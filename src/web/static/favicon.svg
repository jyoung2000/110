<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Wallpaper face — sunset scene -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <!-- Paper backside -->
    <linearGradient id="back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3f0"/>
      <stop offset="100%" stop-color="#e0dbd4"/>
    </linearGradient>
  </defs>

  <!-- Drop shadow behind the sticker -->
  <path d="M4 5 L26 5 L26 13 C22 13 19 17 17 22 L14 30 L4 30 Z"
        fill="rgba(0,0,0,0.15)" transform="translate(1.2, 1.2)"/>

  <!-- Wallpaper sticker — flat portion -->
  <path d="M4 4 L26 4 L26 13 C22 13 19 17 17 22 L14 30 L4 30 Z" fill="url(#sky)"/>

  <!-- Mountain silhouette on the wallpaper -->
  <path d="M4 24 L9 17 L13 21 L16 16 L17 22 L14 30 L4 30 Z" fill="rgba(0,0,0,0.2)"/>

  <!-- Peeling corner curling up — paper backside -->
  <path d="M26 4 L28 2
           C30 2 31 4 30 7
           C29 11 26 15 22 19
           L17 22
           C19 17 22 13 26 13
           Z" fill="url(#back)"/>

  <!-- Fold crease highlight -->
  <path d="M26 13 C22 13 19 17 17 22" fill="none" stroke="#fff" stroke-width="0.9" opacity="0.5"/>

  <!-- Subtle shadow on the curl -->
  <path d="M26 4 L26 13 C28 11 29 8 29 5 L28 2 Z" fill="rgba(0,0,0,0.06)"/>
</svg>
